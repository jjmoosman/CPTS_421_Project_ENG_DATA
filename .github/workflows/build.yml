name: Build Executables

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # tag push -> builds AND publishes a release
  workflow_dispatch:

# cancel superseded runs on rapid pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pandas rapidfuzz pymupdf python-docx openpyxl numpy

      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build with PyInstaller
        shell: bash
        working-directory: ./code/TestApp
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=11.0
          fi
          pyinstaller --onefile --windowed \
            --name "FERPA_Redactor" \
            --collect-all pandas \
            --collect-all numpy \
            --collect-all rapidfuzz \
            --collect-all PyQt6 \
            --hidden-import=PyQt6.sip \
            app.py

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dmg_root
          cp -r code/TestApp/dist/FERPA_Redactor.app dmg_root/
          chmod +x "dmg_root/FERPA_Redactor.app/Contents/MacOS/FERPA_Redactor"
          create-dmg \
            --volname "FERPA Redactor Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "FERPA_Redactor.app" 175 190 \
            --hide-extension "FERPA_Redactor.app" \
            --app-drop-link 425 190 \
            "FERPA_Redactor_Mac.dmg" \
            "dmg_root/"

      - name: Upload Windows Artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: FERPA-Tool-Windows
          path: code/TestApp/dist/*.exe

      - name: Upload Mac Artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: FERPA-Tool-MacOS-Installer
          path: FERPA_Redactor_Mac.dmg

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FERPA-Tool-Windows/*.exe
            artifacts/FERPA-Tool-MacOS-Installer/FERPA_Redactor_Mac.dmg
          generate_release_notes: true
          body: |
            ## Install

            **Windows** — download `FERPA_Redactor.exe` and run it.
            SmartScreen may warn on first launch: click **More info -> Run anyway**.

            **macOS** — download `FERPA_Redactor_Mac.dmg`, open it, drag the app to Applications.
            On first launch, **right-click the app -> Open** (a plain double-click will be
            blocked, since the app isn't notarized by Apple).
